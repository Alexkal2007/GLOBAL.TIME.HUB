<style>
  :root{

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{

  }
  .wrap{max-width:760px; margin:0 auto; padding:56px 24px 80px; position:relative; z-index:1;}

  .brand{font-family:'DM Serif Display',serif; font-weight:700; font-size:20px; letter-spacing:-0.01em; text-decoration:none; color:var(--ink);}

  .lang-toggle{display:flex; background:rgba(0,0,0,0.25); border-radius:10px; padding:4px; gap:2px;}
  .lang-toggle button{border:none; background:transparent; color:var(--ink-muted); font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; padding:7px 14px; border-radius:7px; cursor:pointer;}
  .lang-toggle button.active{background:var(--terracotta); color:#241a05;}
  h1{font-family:'DM Serif Display', serif; font-weight:600; font-size:clamp(28px, 4.5vw, 42px); line-height:1.1; margin:0 0 8px;}
  .lede{color:var(--ink-muted); margin:0 0 40px; line-height:1.6;}
  .panel{background:var(--card); border:1px solid var(--card-border); border-radius:20px; padding:30px; margin-bottom:18px;}
  .panel h2{font-family:'DM Serif Display',serif; font-weight:600; font-size:19px; margin:0 0 12px; color:var(--teal);}
  .panel p{color:var(--ink-muted); line-height:1.7; font-size:15px; margin:0 0 14px;}
  .panel p:last-child{margin-bottom:0;}
  .note{font-size:13px; color:var(--ink-muted); border-left:2px solid var(--terracotta-dim); padding-left:14px; margin-top:8px;}
  .back-link{display:inline-block; margin-top:10px; color:var(--terracotta); font-size:14px; text-decoration:none;}
  .back-link:hover{text-decoration:underline;}
  @media (max-width:520px){ .panel{padding:22px;} nav{flex-direction:column; gap:14px; align-items:flex-start;} }

let lang = 'en';
function renderStatic(){
  const t = I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(t[key] !== undefined) el.innerHTML = t[key];
  });
  document.getElementById('sections').innerHTML = t.sections.map(s =>
    `<div class="panel"><h2>${s[0]}</h2><p>${s[1]}</p></div>`).join('');
  document.getElementById('html-root').lang = lang;
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  document.getElementById('btn-el').classList.toggle('active', lang==='el');
}
function setLang(l){ lang = l; renderStatic(); }
renderStatic();
</script>
